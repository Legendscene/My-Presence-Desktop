  <circle cx="48" cy="304" r="12" fill="#9333ea" />
  <text x="44" y="308" fill="#ffffff" font-size="11" font-weight="700" class="f">📺</text>
  <text x="68" y="299" fill="#cbd5e1" font-size="13" font-weight="500" class="f">Twitch Streaming</text>
