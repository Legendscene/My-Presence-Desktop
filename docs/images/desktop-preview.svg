  <circle cx="48" cy="188" r="12" fill="#10b981" />
  <text x="44" y="192" fill="#ffffff" font-size="11" font-weight="700" class="f">🎮</text>
  <text x="68" y="183" fill="#cbd5e1" font-size="13" font-weight="500" class="f">Minecraft PE</text>
  <text x="68" y="199" fill="#64748b" font-size="11" class="f">Idle • Playing</text>

  <!-- Item 3 -->
  <rect x="30" y="220" width="200" height="52" rx="8" fill="#111522" />
  <circle cx="48" cy="246" r="12" fill="#ff0000" />
  <text x="44" y="250" fill="#ffffff" font-size="11" font-weight="700" class="f">▶</text>
  <text x="68" y="241" fill="#cbd5e1" font-size="13" font-weight="500" class="f">YouTube Binging</text>
  <text x="68" y="257" fill="#64748b" font-size="11" class="f">Idle • Watching</text>

