        <circle cx="48" cy="48" r="9" fill="#18191c" />
        <circle cx="48" cy="48" r="7" fill="#23a55a" />

        <text x="66" y="16" fill="#ffffff" font-size="12" font-weight="700" class="f">Visual Studio Code</text>
        <text x="66" y="30" fill="#dbdee1" font-size="10" class="f">My-Presence Desktop</text>
        <text x="66" y="44" fill="#949ba4" font-size="9" class="f">TypeScript &amp; React</text>
        <text x="66" y="56" fill="#949ba4" font-size="9" class="f">01:42:38 elapsed</text>
      </g>

      <!-- Buttons in Mini Card -->
