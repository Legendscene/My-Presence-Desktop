    <text x="14" y="416" fill="#94a3b8" font-size="10" font-weight="700" class="f">GATEWAY &amp; IPC STATUS</text>
    <text x="14" y="434" fill="#34d399" font-size="11" font-weight="600" class="f">● Connected to Discord</text>
    <text x="14" y="452" fill="#64748b" font-size="10" class="f">Pipe: \\.\pipe\discord-ipc-0</text>
