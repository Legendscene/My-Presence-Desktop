      <rect x="46" y="32" width="32" height="14" rx="3" fill="#20273a" />
      <text x="50" y="42" fill="#7c6cff" font-size="8" class="f">+ Small</text>

      <rect x="94" y="0" width="86" height="52" rx="6" fill="#141928" stroke="#252d42" stroke-width="1" />
      <text x="106" y="22" fill="#cbd5e1" font-size="10" class="f">Gaming</text>
      <rect x="102" y="32" width="32" height="14" rx="3" fill="#20273a" />
      <text x="106" y="42" fill="#7c6cff" font-size="8" class="f">+ Large</text>
      <rect x="140" y="32" width="32" height="14" rx="3" fill="#20273a" />
      <text x="144" y="42" fill="#7c6cff" font-size="8" class="f">+ Small</text>

      <rect x="188" y="0" width="86" height="52" rx="6" fill="#141928" stroke="#252d42" stroke-width="1" />
      <text x="200" y="22" fill="#cbd5e1" font-size="10" class="f">YouTube</text>
      <rect x="196" y="32" width="32" height="14" rx="3" fill="#20273a" />
      <text x="200" y="42" fill="#7c6cff" font-size="8" class="f">+ Large</text>
      <rect x="234" y="32" width="32" height="14" rx="3" fill="#20273a" />
      <text x="238" y="42" fill="#7c6cff" font-size="8" class="f">+ Small</text>

      <rect x="282" y="0" width="96" height="52" rx="6" fill="#141928" stroke="#252d42" stroke-width="1" />
      <text x="294" y="32" fill="#7c6cff" font-size="10" font-weight="600" class="f">Manage &rarr;</text>
