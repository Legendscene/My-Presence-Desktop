  <text x="40" y="46" fill="#ffffff" font-size="12" font-weight="900" class="f">P</text>
  <text x="66" y="46" fill="#f1f5f9" font-size="13" font-weight="700" class="f">My Presence Studio</text>
  <rect x="202" y="32" width="60" height="18" rx="4" fill="#1e2538" />
  <text x="212" y="45" fill="#7c6cff" font-size="10" font-weight="700" class="f">DESKTOP</text>

