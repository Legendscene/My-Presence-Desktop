  <circle cx="48" cy="130" r="12" fill="url(#vscodeGrad)" />
  <text x="44" y="134" fill="#ffffff" font-size="11" font-weight="700" class="f">&lt;/&gt;</text>
  <text x="68" y="125" fill="#f8fafc" font-size="13" font-weight="600" class="f">VS Code &amp; Dev</text>
  <text x="68" y="141" fill="#10b981" font-size="11" class="f">● Live • Playing</text>
  <text x="210" y="128" fill="#f59e0b" font-size="12" class="f">★</text>

